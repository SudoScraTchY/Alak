<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="100%" height="100%">
  <defs>
    <!-- Dark Ink and Funnel Gradients -->
    <linearGradient id="funnelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A2F"/>
      <stop offset="50%" stop-color="#12252B"/>
      <stop offset="100%" stop-color="#0C1417"/>
    </linearGradient>

    <linearGradient id="laserBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFC93C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFDE6A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFC93C" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFC93C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFC93C" stop-opacity="0"/>
    </linearGradient>

    <filter id="softLaserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="slabShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <style>
      /* ========================================================= */
      /* 1. MATHEMATICALLY CENTERED CONVERGENT PARTICLE TRAJECTORY  */
      /* All particles start symmetrically and converge to (200, 160) */
      /* Cycle: 4.2s loop                                          */
      /* ========================================================= */

      /* Particle 1: Center fall (x=200 -> 200) */
      .p-center-1 {
        animation: fallCenter 2.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .p-center-2 {
        animation: fallCenter 2.1s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.05s;
      }
      @keyframes fallCenter {
        0% { transform: translateY(-30px) scale(0.5); opacity: 0; }
        25% { opacity: 0.95; }
        65% { transform: translateY(70px) scale(0.9); opacity: 1; }
        90% { transform: translateY(115px) scale(0.5); opacity: 0.8; }
        100% { transform: translateY(130px) scale(0.1); opacity: 0; }
      }

      /* Particle 2: Left to Center (x=150 -> x=200, dx=+50) */
      .p-left-1 {
        animation: fallLeftToCenter 2.1s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.35s;
      }
      .p-left-2 {
        animation: fallLeftToCenter 2.1s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.4s;
      }
      @keyframes fallLeftToCenter {
        0% { transform: translate(0px, -30px) scale(0.5); opacity: 0; }
        25% { opacity: 0.95; }
        65% { transform: translate(30px, 70px) scale(0.9); opacity: 1; }
        90% { transform: translate(46px, 115px) scale(0.5); opacity: 0.8; }
        100% { transform: translate(50px, 130px) scale(0.1); opacity: 0; }
      }

      /* Particle 3: Right to Center (x=250 -> x=200, dx=-50) */
      .p-right-1 {
        animation: fallRightToCenter 2.1s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.7s;
      }
      .p-right-2 {
        animation: fallRightToCenter 2.1s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.75s;
      }
      @keyframes fallRightToCenter {
        0% { transform: translate(0px, -30px) scale(0.5); opacity: 0; }
        25% { opacity: 0.95; }
        65% { transform: translate(-30px, 70px) scale(0.9); opacity: 1; }
        90% { transform: translate(-46px, 115px) scale(0.5); opacity: 0.8; }
        100% { transform: translate(-50px, 130px) scale(0.1); opacity: 0; }
      }

      /* Sieve laser scan at the throat */
      .laser-sweep {
        animation: laserScan 1.6s ease-in-out infinite alternate;
      }
      @keyframes laserScan {
        0% { transform: translateY(-6px); opacity: 0.5; }
        100% { transform: translateY(6px); opacity: 1; }
      }

      /* ========================================================= */
      /* 2. DOCKED, STABLE, AMPLE READING TIME FOR ALL 3 CARDS      */
      /* Total cycle: 4.5s. Cards arrive by 1.2s and STAY TOTALLY  */
      /* VISIBLE & DOCKED for 2.6+ full seconds so user sees them!  */
      /* ========================================================= */
      .chunk-wallet {
        animation: cardStay 4.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .chunk-offers {
        animation: cardStay 4.5s cubic-bezier(0.16, 1, 0.3, 1) infinite 0.25s;
      }
      .chunk-money {
        animation: cardStay 4.5s cubic-bezier(0.16, 1, 0.3, 1) infinite 0.5s;
      }

      @keyframes cardStay {
        0% {
          transform: translateY(-28px) scale(0.92);
          opacity: 0;
        }
        18% {
          transform: translateY(0px) scale(1);
          opacity: 1;
        }
        /* DWELL STATE: Cards remain 100% visible, crisp and readable! */
        82% {
          transform: translateY(0px) scale(1);
          opacity: 1;
        }
        94% {
          transform: translateY(6px) scale(0.99);
          opacity: 0.6;
        }
        100% {
          transform: translateY(12px) scale(0.95);
          opacity: 0;
        }
      }
    </style>
  </defs>

  <!-- Background Dark Canvas -->
  <rect width="100%" height="100%" rx="36" fill="#0C1417"/>

  <!-- Subtle ambient glow background -->
  <circle cx="200" cy="140" r="100" fill="#131E22" opacity="0.6"/>
  <polygon points="130,70 270,70 225,160 175,160" fill="url(#glowCone)"/>

  <!-- ============================================================== -->
  <!-- ZONE 1: INCOMING PARTICLES (SYMMETRICALLY CENTERED ON x = 200) -->
  <!-- ============================================================== -->
  <g id="incoming-particles">
    <!-- Center fall particles (Starts at x=200, y=35) -->
    <g class="p-center-1" transform="translate(200, 35)">
      <circle cx="0" cy="0" r="6" fill="#FFC93C"/>
      <polygon points="0,-4 3,3 -3,3" fill="#12252B"/>
    </g>
    <g class="p-center-2" transform="translate(200, 35)">
      <circle cx="0" cy="0" r="5.5" fill="#7C9CFF"/>
      <rect x="-2" y="-2" width="4" height="4" fill="#FFFFFF"/>
    </g>

    <!-- Left particles (Starts at x=150, y=30 -> Converges to x=200) -->
    <g class="p-left-1" transform="translate(150, 30)">
      <circle cx="0" cy="0" r="6.5" fill="#B98CFF"/>
      <rect x="-3" y="-3" width="6" height="6" rx="2" fill="#FFFFFF"/>
    </g>
    <g class="p-left-2" transform="translate(150, 30)">
      <polygon points="0,-7 6,4 -6,4" fill="#FF9A57"/>
    </g>

    <!-- Right particles (Starts at x=250, y=30 -> Converges to x=200) -->
    <g class="p-right-1" transform="translate(250, 30)">
      <circle cx="0" cy="0" r="6" fill="#3CC8DD"/>
      <rect x="-3" y="-1.5" width="6" height="3" fill="#FFFFFF"/>
    </g>
    <g class="p-right-2" transform="translate(250, 30)">
      <circle cx="0" cy="0" r="5.5" fill="#FF7A9C"/>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- ZONE 2: THE PERFECTLY SYMMETRIC SIEVE FUNNEL (CENTER: x = 200)  -->
  <!-- ============================================================== -->
  <g transform="translate(200, 130)">
    <!-- Funnel Walls: Top width 160 (x=-80 to +80), Bottom throat width 64 (x=-32 to +32) -->
    <polygon points="-80,-45 80,-45 32,25 -32,25" fill="url(#funnelGrad)" stroke="#243339" stroke-width="2.5"/>
    
    <!-- Symmetric Perforated Sieve Holes -->
    <g fill="#0C1417">
      <!-- Row 1 -->
      <circle cx="-50" cy="-30" r="2.5"/><circle cx="-25" cy="-30" r="2.5"/><circle cx="0" cy="-30" r="2.5"/><circle cx="25" cy="-30" r="2.5"/><circle cx="50" cy="-30" r="2.5"/>
      <!-- Row 2 -->
      <circle cx="-35" cy="-12" r="2.5"/><circle cx="-12" cy="-12" r="2.5"/><circle cx="12" cy="-12" r="2.5"/><circle cx="35" cy="-12" r="2.5"/>
      <!-- Row 3 -->
      <circle cx="-20" cy="6" r="2.5"/><circle cx="0" cy="6" r="2.5"/><circle cx="20" cy="6" r="2.5"/>
      <!-- Row 4 -->
      <circle cx="-10" cy="18" r="2.5"/><circle cx="10" cy="18" r="2.5"/>
    </g>

    <!-- Sieve Mesh Grill at Throat (Centered at x=0) -->
    <rect x="-32" y="24" width="64" height="8" rx="3" fill="#12252B" stroke="#FFC93C" stroke-width="1.8"/>
    <line x1="-22" y1="24" x2="-22" y2="32" stroke="#FFC93C" stroke-width="1.2"/>
    <line x1="-11" y1="24" x2="-11" y2="32" stroke="#FFC93C" stroke-width="1.2"/>
    <line x1="0" y1="24" x2="0" y2="32" stroke="#FFC93C" stroke-width="1.6"/>
    <line x1="11" y1="24" x2="11" y2="32" stroke="#FFC93C" stroke-width="1.2"/>
    <line x1="22" y1="24" x2="22" y2="32" stroke="#FFC93C" stroke-width="1.2"/>

    <!-- Laser Scanning Sieve Beam -->
    <g class="laser-sweep">
      <line x1="-70" y1="-10" x2="70" y2="-10" stroke="url(#laserBeamGrad)" stroke-width="2.5" filter="url(#softLaserGlow)"/>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- ZONE 3: THREE CLEAN, DOCKED, FULLY READABLE CARDS (AMPLE TIME)  -->
  <!-- ============================================================== -->
  <g transform="translate(65, 195)">
    <!-- CARD 1: WALLET / PROMO CODE (GOLD SPINE) -->
    <g class="chunk-wallet" filter="url(#slabShadow)" transform="translate(0, 0)">
      <path d="M 0,0 L 270,0 
               A 6,6 0 0,1 270,12 L 270,30 A 6,6 0 0,1 270,42 L 0,42 
               A 6,6 0 0,1 0,30 L 0,12 A 6,6 0 0,1 0,0 Z" 
            fill="#FFFFFF"/>
      <!-- Gold Spine -->
      <rect x="0" y="0" width="7" height="42" rx="3" fill="#FFC93C"/>
      <!-- Perforation Divider -->
      <line x1="195" y1="0" x2="195" y2="42" stroke="#A3B5BB" stroke-width="1.5" stroke-dasharray="3 3"/>
      <!-- Store & Code text -->
      <text x="20" y="20" font-family="'JetBrains Mono', monospace" font-size="12.5" font-weight="700" fill="#12252B" letter-spacing="2">SNAPP50</text>
      <text x="20" y="34" font-family="-apple-system, sans-serif" font-size="9" font-weight="500" fill="#4A5D64">50% off ride promo</text>
      <!-- Badge -->
      <rect x="205" y="10" width="55" height="22" rx="5" fill="#FFEDB5"/>
      <text x="232" y="25" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#B77900">WALLET</text>
    </g>

    <!-- CARD 2: OFFERS (PURPLE SPINE) -->
    <g class="chunk-offers" filter="url(#slabShadow)" transform="translate(0, 56)">
      <path d="M 0,0 L 270,0 
               A 6,6 0 0,1 270,12 L 270,30 A 6,6 0 0,1 270,42 L 0,42 
               A 6,6 0 0,1 0,30 L 0,12 A 6,6 0 0,1 0,0 Z" 
            fill="#FFFFFF"/>
      <!-- Purple Spine -->
      <rect x="0" y="0" width="7" height="42" rx="3" fill="#8248D6"/>
      <line x1="195" y1="0" x2="195" y2="42" stroke="#A3B5BB" stroke-width="1.5" stroke-dasharray="3 3"/>
      <!-- Content -->
      <text x="20" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#12252B">Digikala · Flash Sale</text>
      <text x="20" y="34" font-family="-apple-system, sans-serif" font-size="9" font-weight="500" fill="#4A5D64">Special discount up to 70%</text>
      <!-- Badge -->
      <rect x="205" y="10" width="55" height="22" rx="5" fill="#F0E7FC"/>
      <text x="232" y="25" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#8248D6">OFFERS</text>
    </g>

    <!-- CARD 3: MONEY (TEAL SPINE) -->
    <g class="chunk-money" filter="url(#slabShadow)" transform="translate(0, 112)">
      <path d="M 0,0 L 270,0 
               A 6,6 0 0,1 270,12 L 270,30 A 6,6 0 0,1 270,42 L 0,42 
               A 6,6 0 0,1 0,30 L 0,12 A 6,6 0 0,1 0,0 Z" 
            fill="#FFFFFF"/>
      <!-- Teal Spine -->
      <rect x="0" y="0" width="7" height="42" rx="3" fill="#0C8397"/>
      <line x1="195" y1="0" x2="195" y2="42" stroke="#A3B5BB" stroke-width="1.5" stroke-dasharray="3 3"/>
      <!-- Content -->
      <text x="20" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#12252B">Mellat Bank · Deposit</text>
      <text x="20" y="34" font-family="-apple-system, sans-serif" font-size="9" font-weight="500" fill="#4A5D64">+250,000 Toman received</text>
      <!-- Badge -->
      <rect x="205" y="10" width="55" height="22" rx="5" fill="#D8F0F4"/>
      <text x="232" y="25" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0C8397">MONEY</text>
    </g>
  </g>
</svg>