<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="100%" height="100%">
  <defs>
    <!-- Dark Ink and Funnel Gradients -->
    <linearGradient id="funnelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2A2F"/>
      <stop offset="50%" stop-color="#12252B"/>
      <stop offset="100%" stop-color="#0C1417"/>
    </linearGradient>

    <linearGradient id="laserBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFC93C" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFDE6A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFC93C" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFC93C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFC93C" stop-opacity="0"/>
    </linearGradient>

    <filter id="softLaserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="slabShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <style>
      /* ========================================================= */
      /* 1. MATHEMATICALLY BULLETPROOF CONVERGENT PARTICLE STREAMS */
      /* Absolute (x, y) coordinates ensure zero transform collisions */
      /* Funnel throat is at exact center: (200, 158)             */
      /* ========================================================= */

      /* Stream 1: Center fall straight down into throat (x=200) */
      .p-center-1 {
        animation: pFallCenter 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .p-center-2 {
        animation: pFallCenter 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.1s;
      }
      @keyframes pFallCenter {
        0%   { transform: translate(200px, 12px) scale(0.6); opacity: 0; }
        20%  { opacity: 0.95; }
        60%  { transform: translate(200px, 85px) scale(0.9); opacity: 1; }
        85%  { transform: translate(200px, 135px) scale(0.6); opacity: 0.8; }
        100% { transform: translate(200px, 158px) scale(0.15); opacity: 0; }
      }

      /* Stream 2: Left-mid stream (x=165 -> 200) */
      .p-left-mid-1 {
        animation: pFallLeftMid 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.35s;
      }
      .p-left-mid-2 {
        animation: pFallLeftMid 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.45s;
      }
      @keyframes pFallLeftMid {
        0%   { transform: translate(165px, 18px) scale(0.6); opacity: 0; }
        20%  { opacity: 0.95; }
        60%  { transform: translate(175px, 85px) scale(0.9); opacity: 1; }
        85%  { transform: translate(192px, 135px) scale(0.6); opacity: 0.8; }
        100% { transform: translate(200px, 158px) scale(0.15); opacity: 0; }
      }

      /* Stream 3: Right-mid stream (x=235 -> 200) */
      .p-right-mid-1 {
        animation: pFallRightMid 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.7s;
      }
      .p-right-mid-2 {
        animation: pFallRightMid 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite 1.8s;
      }
      @keyframes pFallRightMid {
        0%   { transform: translate(235px, 18px) scale(0.6); opacity: 0; }
        20%  { opacity: 0.95; }
        60%  { transform: translate(225px, 85px) scale(0.9); opacity: 1; }
        85%  { transform: translate(208px, 135px) scale(0.6); opacity: 0.8; }
        100% { transform: translate(200px, 158px) scale(0.15); opacity: 0; }
      }

      /* Stream 4: Far-left stream (x=135 -> 200) */
      .p-outer-left {
        animation: pFallOuterLeft 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.9s;
      }
      @keyframes pFallOuterLeft {
        0%   { transform: translate(135px, 25px) scale(0.55); opacity: 0; }
        20%  { opacity: 0.95; }
        60%  { transform: translate(155px, 85px) scale(0.85); opacity: 1; }
        85%  { transform: translate(185px, 135px) scale(0.55); opacity: 0.8; }
        100% { transform: translate(200px, 158px) scale(0.15); opacity: 0; }
      }

      /* Stream 5: Far-right stream (x=265 -> 200) */
      .p-outer-right {
        animation: pFallOuterRight 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.5s;
      }
      @keyframes pFallOuterRight {
        0%   { transform: translate(265px, 25px) scale(0.55); opacity: 0; }
        20%  { opacity: 0.95; }
        60%  { transform: translate(245px, 85px) scale(0.85); opacity: 1; }
        85%  { transform: translate(215px, 135px) scale(0.55); opacity: 0.8; }
        100% { transform: translate(200px, 158px) scale(0.15); opacity: 0; }
      }

      /* Throat laser scan */
      .laser-sweep {
        animation: laserScan 1.6s ease-in-out infinite alternate;
      }
      @keyframes laserScan {
        0%   { transform: translateY(-5px); opacity: 0.5; }
        100% { transform: translateY(5px); opacity: 1; }
      }

      /* ========================================================= */
      /* 2. DOCKED, NON-COLLIDING CARDS WITH AMPLE DWELL TIME      */
      /* Total cycle: 4.5s. Cards emerge and stay docked for 3.1s  */
      /* ========================================================= */
      .card-delay-1 {
        animation: cardEmerge 4.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .card-delay-2 {
        animation: cardEmerge 4.5s cubic-bezier(0.16, 1, 0.3, 1) infinite 0.25s;
      }
      .card-delay-3 {
        animation: cardEmerge 4.5s cubic-bezier(0.16, 1, 0.3, 1) infinite 0.5s;
      }

      @keyframes cardEmerge {
        0% {
          transform: translateY(-22px) scale(0.92);
          opacity: 0;
        }
        16% {
          transform: translateY(0px) scale(1);
          opacity: 1;
        }
        /* DWELL STATE: Cards remain 100% visible, crisp and readable! */
        84% {
          transform: translateY(0px) scale(1);
          opacity: 1;
        }
        94% {
          transform: translateY(6px) scale(0.98);
          opacity: 0.5;
        }
        100% {
          transform: translateY(12px) scale(0.94);
          opacity: 0;
        }
      }
    </style>
  </defs>

  <!-- Background Canvas: Matches Deep Ink (#12252B) palette -->
  <rect width="100%" height="100%" fill="#12252B"/>

  <!-- Subtle ambient glow background -->
  <circle cx="200" cy="140" r="100" fill="#131E22" opacity="0.6"/>
  <polygon points="130,70 270,70 225,160 175,160" fill="url(#glowCone)"/>

  <!-- ============================================================== -->
  <!-- ZONE 1: INCOMING PARTICLES (SYMMETRICALLY CENTERED ON x = 200) -->
  <!-- All shapes centered at (0, 0), animated by absolute keyframes -->
  <!-- ============================================================== -->
  <g id="incoming-particles">
    <!-- Center fall particles (x=200) -->
    <g class="p-center-1">
      <circle cx="0" cy="0" r="6" fill="#FFC93C"/>
      <polygon points="0,-4 3,3 -3,3" fill="#12252B"/>
    </g>
    <g class="p-center-2">
      <circle cx="0" cy="0" r="5.5" fill="#7C9CFF"/>
      <rect x="-2" y="-2" width="4" height="4" fill="#FFFFFF"/>
    </g>

    <!-- Left-mid particles (x=165 -> 200) -->
    <g class="p-left-mid-1">
      <circle cx="0" cy="0" r="6.5" fill="#B98CFF"/>
      <rect x="-2.5" y="-2.5" width="5" height="5" rx="1.5" fill="#FFFFFF"/>
    </g>
    <g class="p-left-mid-2">
      <polygon points="0,-6 5,3 -5,3" fill="#FF9A57"/>
    </g>

    <!-- Right-mid particles (x=235 -> 200) -->
    <g class="p-right-mid-1">
      <circle cx="0" cy="0" r="6" fill="#3CC8DD"/>
      <rect x="-2.5" y="-1.5" width="5" height="3" fill="#FFFFFF"/>
    </g>
    <g class="p-right-mid-2">
      <circle cx="0" cy="0" r="5.5" fill="#FF7A9C"/>
    </g>

    <!-- Outer-left particle (x=135 -> 200) -->
    <g class="p-outer-left">
      <circle cx="0" cy="0" r="5" fill="#FFD15C"/>
    </g>

    <!-- Outer-right particle (x=265 -> 200) -->
    <g class="p-outer-right">
      <polygon points="0,-5 4,3 -4,3" fill="#8CE8FF"/>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- ZONE 2: THE PERFECTLY SYMMETRIC SIEVE FUNNEL (CENTER: x = 200)  -->
  <!-- ============================================================== -->
  <g transform="translate(200, 130)">
    <!-- Funnel Walls: Top width 160 (x=-80 to +80), Bottom throat width 64 (x=-32 to +32) -->
    <polygon points="-80,-45 80,-45 32,25 -32,25" fill="url(#funnelGrad)" stroke="#243339" stroke-width="2.5"/>
    
    <!-- Symmetric Perforated Sieve Holes -->
    <g fill="#0C1417">
      <!-- Row 1 -->
      <circle cx="-50" cy="-30" r="2.5"/><circle cx="-25" cy="-30" r="2.5"/><circle cx="0" cy="-30" r="2.5"/><circle cx="25" cy="-30" r="2.5"/><circle cx="50" cy="-30" r="2.5"/>
      <!-- Row 2 -->
      <circle cx="-35" cy="-12" r="2.5"/><circle cx="-12" cy="-12" r="2.5"/><circle cx="12" cy="-12" r="2.5"/><circle cx="35" cy="-12" r="2.5"/>
      <!-- Row 3 -->
      <circle cx="-20" cy="6" r="2.5"/><circle cx="0" cy="6" r="2.5"/><circle cx="20" cy="6" r="2.5"/>
      <!-- Row 4 -->
      <circle cx="-10" cy="18" r="2.5"/><circle cx="10" cy="18" r="2.5"/>
    </g>

    <!-- Sieve Mesh Grill at Throat (Centered at x=0) -->
    <rect x="-32" y="24" width="64" height="8" rx="3" fill="#12252B" stroke="#FFC93C" stroke-width="1.8"/>
    <line x1="-22" y1="24" x2="-22" y2="32" stroke="#FFC93C" stroke-width="1.2"/>
    <line x1="-11" y1="24" x2="-11" y2="32" stroke="#FFC93C" stroke-width="1.2"/>
    <line x1="0" y1="24" x2="0" y2="32" stroke="#FFC93C" stroke-width="1.6"/>
    <line x1="11" y1="24" x2="11" y2="32" stroke="#FFC93C" stroke-width="1.2"/>
    <line x1="22" y1="24" x2="22" y2="32" stroke="#FFC93C" stroke-width="1.2"/>

    <!-- Laser Scanning Sieve Beam -->
    <g class="laser-sweep">
      <line x1="-70" y1="-10" x2="70" y2="-10" stroke="url(#laserBeamGrad)" stroke-width="2.5" filter="url(#softLaserGlow)"/>
    </g>
  </g>

  <!-- ============================================================== -->
  <!-- ZONE 3: THREE CLEAN, DOCKED, NON-COLLIDING CARDS              -->
  <!-- Each card has its own stable parent transform (60, Y)          -->
  <!-- ============================================================== -->
  
  <!-- CARD 1: WALLET / PROMO CODE (GOLD SPINE) - Docked at Y=195 -->
  <g transform="translate(60, 195)">
    <g class="card-delay-1" filter="url(#slabShadow)">
      <path d="M 0,0 L 280,0 
               A 6,6 0 0,1 280,12 L 280,34 A 6,6 0 0,1 280,46 L 0,46 
               A 6,6 0 0,1 0,34 L 0,12 A 6,6 0 0,1 0,0 Z" 
            fill="#FFFFFF"/>
      <!-- Gold Spine -->
      <rect x="0" y="0" width="8" height="46" rx="4" fill="#FFC93C"/>
      <!-- Perforation Divider -->
      <line x1="202" y1="0" x2="202" y2="46" stroke="#A3B5BB" stroke-width="1.5" stroke-dasharray="3 3"/>
      <!-- Store & Code text -->
      <text x="20" y="21" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#12252B" letter-spacing="2">SNAPP50</text>
      <text x="20" y="37" font-family="-apple-system, sans-serif" font-size="9" font-weight="500" fill="#4A5D64">50% off ride promo</text>
      <!-- Badge -->
      <rect x="212" y="11" width="58" height="24" rx="5" fill="#FFEDB5"/>
      <text x="241" y="27" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#B77900">WALLET</text>
    </g>
  </g>

  <!-- CARD 2: OFFERS (PURPLE SPINE) - Docked at Y=252 -->
  <g transform="translate(60, 252)">
    <g class="card-delay-2" filter="url(#slabShadow)">
      <path d="M 0,0 L 280,0 
               A 6,6 0 0,1 280,12 L 280,34 A 6,6 0 0,1 280,46 L 0,46 
               A 6,6 0 0,1 0,34 L 0,12 A 6,6 0 0,1 0,0 Z" 
            fill="#FFFFFF"/>
      <!-- Purple Spine -->
      <rect x="0" y="0" width="8" height="46" rx="4" fill="#8248D6"/>
      <line x1="202" y1="0" x2="202" y2="46" stroke="#A3B5BB" stroke-width="1.5" stroke-dasharray="3 3"/>
      <!-- Content -->
      <text x="20" y="21" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#12252B">Digikala · Flash Sale</text>
      <text x="20" y="37" font-family="-apple-system, sans-serif" font-size="9" font-weight="500" fill="#4A5D64">Special discount up to 70%</text>
      <!-- Badge -->
      <rect x="212" y="11" width="58" height="24" rx="5" fill="#F0E7FC"/>
      <text x="241" y="27" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#8248D6">OFFERS</text>
    </g>
  </g>

  <!-- CARD 3: MONEY (TEAL SPINE) - Docked at Y=309 -->
  <g transform="translate(60, 309)">
    <g class="card-delay-3" filter="url(#slabShadow)">
      <path d="M 0,0 L 280,0 
               A 6,6 0 0,1 280,12 L 280,34 A 6,6 0 0,1 280,46 L 0,46 
               A 6,6 0 0,1 0,34 L 0,12 A 6,6 0 0,1 0,0 Z" 
            fill="#FFFFFF"/>
      <!-- Teal Spine -->
      <rect x="0" y="0" width="8" height="46" rx="4" fill="#0C8397"/>
      <line x1="202" y1="0" x2="202" y2="46" stroke="#A3B5BB" stroke-width="1.5" stroke-dasharray="3 3"/>
      <!-- Content -->
      <text x="20" y="21" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#12252B">Mellat Bank · Deposit</text>
      <text x="20" y="37" font-family="-apple-system, sans-serif" font-size="9" font-weight="500" fill="#4A5D64">+250,000 Toman received</text>
      <!-- Badge -->
      <rect x="212" y="11" width="58" height="24" rx="5" fill="#D8F0F4"/>
      <text x="241" y="27" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="700" fill="#0C8397">MONEY</text>
    </g>
  </g>
</svg>
