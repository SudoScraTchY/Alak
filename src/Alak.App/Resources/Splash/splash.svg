<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Minimalist Alak Brand Logo for System Fallback Splash -->
  <rect width="512" height="512" fill="#12252B"/>
  
  <g transform="translate(256, 256) scale(0.35) translate(-512, -470)">
    <!-- 1. NOISE TOKENS -->
    <circle cx="410" cy="220" r="32" fill="#B98CFF"/>
    <circle cx="512" cy="165" r="38" fill="#FFC93C"/>
    <circle cx="614" cy="220" r="32" fill="#3CC8DD"/>

    <!-- 2. THE SIEVE HOOP -->
    <ellipse cx="512" cy="405" rx="340" ry="110" fill="#12252B" stroke="#243339" stroke-width="24"/>
    <ellipse cx="512" cy="405" rx="315" ry="95" fill="#0C1417" stroke="#FFC93C" stroke-width="20"/>

    <!-- Cross Grid Lines -->
    <g stroke="#FFC93C" stroke-width="12" stroke-linecap="round" opacity="0.9">
      <line x1="230" y1="405" x2="794" y2="405" stroke-width="16"/>
      <line x1="280" y1="365" x2="744" y2="365"/>
      <line x1="280" y1="445" x2="744" y2="445"/>

      <line x1="360" y1="350" x2="360" y2="460"/>
      <line x1="435" y1="325" x2="435" y2="485"/>
      <line x1="512" y1="315" x2="512" y2="495" stroke-width="18"/>
      <line x1="589" y1="325" x2="589" y2="485"/>
      <line x1="664" y1="350" x2="664" y2="460"/>
    </g>

    <!-- 3. OUTPUT SLABS -->
    <!-- Slab 3 (Bottom: Teal) -->
    <g transform="translate(232, 715)">
      <rect x="0" y="0" width="560" height="90" rx="24" fill="#FFFFFF"/>
      <rect x="0" y="0" width="24" height="90" rx="12" fill="#0C8397"/>
      <rect x="55" y="32" width="160" height="26" rx="13" fill="#12252B"/>
      <circle cx="490" cy="45" r="20" fill="#D8F0F4"/>
    </g>

    <!-- Slab 2 (Middle: Purple) -->
    <g transform="translate(212, 615)">
      <rect x="0" y="0" width="600" height="90" rx="24" fill="#FFFFFF"/>
      <rect x="0" y="0" width="24" height="90" rx="12" fill="#8248D6"/>
      <rect x="55" y="32" width="200" height="26" rx="13" fill="#12252B"/>
      <circle cx="530" cy="45" r="20" fill="#F0E7FC"/>
    </g>

    <!-- Slab 1 (Top: Gold) -->
    <g transform="translate(192, 515)">
      <rect x="0" y="0" width="640" height="90" rx="24" fill="#FFFFFF"/>
      <rect x="0" y="0" width="24" height="90" rx="12" fill="#FFC93C"/>
      <rect x="55" y="32" width="240" height="26" rx="13" fill="#12252B"/>
      <circle cx="570" cy="45" r="20" fill="#FFF0CE"/>
    </g>
  </g>
</svg>
